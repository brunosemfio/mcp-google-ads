name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check google_ads_mcp tests
      - run: uv run mypy google_ads_mcp
      - run: uv run pytest --cov=google_ads_mcp --cov-report=term-missing --cov-fail-under=65
